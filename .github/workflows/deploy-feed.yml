name: Generate and Deploy Feed

on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-rfc-feed:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:master
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always use the latest production database, including a commit made by the caller.
          ref: master

      - name: Copy production database
        run: cp data/production.db /app/data/production.db

      - name: Generate feed
        run: php bin/console rfc:generate-feed -o feed.xml --limit=50
        working-directory: /app

      - name: Upload feed
        uses: actions/upload-artifact@v4
        with:
          name: rfc-feed
          path: /app/feed.xml

  deploy-feed:
    runs-on: ubuntu-latest
    needs: generate-rfc-feed

    steps:
      - name: Download generated feed
        uses: actions/download-artifact@v4
        with:
          name: rfc-feed
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=php-rfc-feed
